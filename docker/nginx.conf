# Local stack: serves the built site and proxies the STOMP WebSocket to RabbitMQ.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /ws {
        proxy_pass http://rabbitmq:15674/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
    }

    # Used by the login page for rate limiting, as on the production load balancer.
    location = /client-ip {
        default_type text/plain;
        return 200 $remote_addr;
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
