# The whole stack on one machine:  docker compose up --build
# Then open http://localhost:8080 and log in as demo@canineconnections.org / demo1234
# (admin portal: http://localhost:8080/admin with admin@canineconnections.org / admin1234).
#
# Every password here is a local-development default. Production uses the .env files instead.
name: canine-connections

x-worker-env: &worker-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: canine
  RABBITMQ_PASS: canine-dev-backend
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: adoption_center
  DB_USER: adoption_user
  DB_PASS: canine-dev-db
  APP_KEY: local-dev-key-change-me-in-production
  APP_URL: http://localhost:8080
  MAIL_DRIVER: log

x-worker: &worker
  build:
    context: .
    dockerfile: docker/php.Dockerfile
  image: canine-connections-php
  environment: *worker-env
  restart: unless-stopped
  depends_on:
    mysql: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: canine-dev-root
      MYSQL_DATABASE: adoption_center
      MYSQL_USER: adoption_user
      MYSQL_PASSWORD: canine-dev-db
    volumes:
      # Loaded once, on the first start (delete the volume to reset: docker compose down -v).
      - ./database/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/sql/seed_resources.sql:/docker-entrypoint-initdb.d/02-resources.sql:ro
      - ./database/sql/dev_seed.sql:/docker-entrypoint-initdb.d/03-dev-seed.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcanine-dev-root"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.1-management
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "15672:15672"   # management UI (user: canine / canine-dev-backend)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  db-worker:
    <<: *worker
    working_dir: /app/database
    command: ["php", "db_worker.php"]

  dbridge-worker:
    <<: *worker
    working_dir: /app/backend
    command: ["php", "dbridge.php"]

  frontend-worker:
    <<: *worker
    working_dir: /app/backend
    command: ["php", "frontend.php"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      rabbitmq: { condition: service_healthy }

volumes:
  mysql-data:
