<!doctype html>
<!-- Root HTML document served to the browser. Vite injects the built JS bundle at build time. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser tab favicon — uses the Vite SVG in /public -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Ensures the page scales correctly on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canine Connections</title>

    <!-- Font Awesome icon library loaded from CDN for use throughout the app -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <!-- Preconnect hints speed up the Google Fonts request by opening the TCP connection early -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter font loaded at weights 400, 600, 700 — used as the primary typeface across the app -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- React mounts the entire application inside this single div -->
    <div id="root"></div>
    <!-- Entry point module — Vite processes this and replaces it with the optimised bundle in production -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
